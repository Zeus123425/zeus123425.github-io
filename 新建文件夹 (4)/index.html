<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  /* ── 全局细宋体设定 ── */
  html, body { 
    height: 100%; overflow: hidden; background: #000; 
    font-family: "Songti SC", "SimSun", "STSong", serif; 
    font-weight: 300;
    color: #111; 
    -webkit-font-smoothing: antialiased;
  }
  
  /* ── 手机框架 ── */
  .phone { 
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; 
    background: #fff; overflow: hidden; display: flex; flex-direction: column; 
  }
  @media (min-width: 768px) {
    body { display: flex; align-items: center; justify-content: center; background: #1a1a1a; }
    .phone { position: relative; inset: auto; width: 480px; height: 92vh; max-height: 960px; border-radius: 40px; box-shadow: 0 30px 120px rgba(0,0,0,0.5); }
  }

  /* ── 浏览器视图 ── */
  .browser-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 28px; }
  .browser-view.hide { display: none; }
  .search-wrap { width: 100%; max-width: 520px; position: relative; }
  .search-bar { width: 100%; display: flex; align-items: center; gap: 12px; padding: 15px 24px; border: 1px solid #dcdcdc; border-radius: 999px; background: #fff; transition: border-color 0.2s; }
  .search-bar:focus-within { border-color: #9a9a9a; }
  .search-icon { width: 19px; height: 19px; color: #999; }
  .search-input { flex: 1; border: none; outline: none; font-size: 16px; color: #111; background: transparent; font-family: inherit; }
  .caption { font-size: 14px; letter-spacing: 1.8px; color: #b5b5b5; }
  
  /* 历史记录 */
  .history-panel { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: #fff; border: 1px solid #e6e6e6; border-radius: 16px; box-shadow: 0 10px 36px rgba(0,0,0,0.08); overflow: hidden; z-index: 20; display: none; }
  .history-panel.open { display: block; }
  .history-header { display: flex; justify-content: space-between; padding: 12px 20px 6px; font-size: 12px; color: #b0b0b0; text-transform: uppercase; }
  .history-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; cursor: pointer; transition: background 0.15s; }
  .history-item:hover { background: #f7f7f7; }
  .history-item .h-text { flex: 1; font-size: 16px; color: #222; }

  /* X 启动加载动画 */
  .x-splash {
    position: absolute; inset: 0; background: #000; z-index: 999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  .x-splash.show { opacity: 1; pointer-events: auto; }
  .x-splash svg {
    width: 60px; height: 60px; fill: #fff;
    animation: pulse-logo 1.2s ease-in-out infinite;
  }
  @keyframes pulse-logo {
    0% { transform: scale(0.9); opacity: 0.6; }
    50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)); }
    100% { transform: scale(0.9); opacity: 0.6; }
  }

  /* ── X 容器 ── */
  .x-view { flex: 1; display: none; flex-direction: column; background: #000; color: #e7e9ea; overflow: hidden; position: relative; }
  .x-view.show { display: flex; }
  
  /* 核心动画：层级变化 */
  .page-main, .page-comment, .page-chat {
    position: absolute; inset: 0; display: flex; flex-direction: column; background: #000;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
    will-change: transform, opacity;
  }
  
  .page-main { transform: translateX(0) scale(1); opacity: 1; z-index: 10; }
  .page-comment, .page-chat { transform: translateX(100%) scale(1); opacity: 0; z-index: 20; box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
  
  .x-view.in-comment .page-main { transform: translateX(-20%) scale(0.95); opacity: 0.5; }
  .x-view.in-comment .page-comment { transform: translateX(0) scale(1); opacity: 1; }

  .x-view.in-chat .page-main { transform: translateX(-20%) scale(0.95); opacity: 0.5; }
  .x-view.in-chat .page-chat { transform: translateX(0) scale(1); opacity: 1; }

  /* 隐藏所有滚动条，并保证文字不会被挤压 */
  .x-scroll, .chat-area { 
    flex: 1; 
    overflow-y: auto; 
    overflow-x: hidden; 
    scrollbar-width: none !important; /* Firefox */
    -ms-overflow-style: none !important; /* IE 10+ */
  }
  .x-scroll::-webkit-scrollbar, .chat-area::-webkit-scrollbar { 
    display: none !important; /* Chrome/Safari/Webkit */
    width: 0 !important;
  }
  
  .x-topbar { display: flex; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #2f3336; position: sticky; top: 0; z-index: 10; flex-shrink: 0; }
  .x-topbar .back { font-size: 22px; cursor: pointer; width: 40px; color: #e7e9ea; }
  .x-topbar .name { font-size: 18px; font-weight: 600; flex: 1; text-align: center; letter-spacing: 1px;}
  
  /* 图片与用户信息 */
  .x-banner { height: 200px; width: 100%; background: #161616; }
  .x-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .x-avatar-row { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 16px; margin-top: -50px; position: relative; z-index: 2; }
  .x-avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #000; overflow: hidden; background: #1a1a1a; }
  .x-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  .x-actions-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .x-action-btn { 
    background: #eff3f4; color: #0f1419; border: none; border-radius: 999px; 
    padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; 
    transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
  }
  .x-action-btn.outline { background: transparent; color: #e7e9ea; border: 1px solid #536471; }
  .x-action-btn:hover { opacity: 0.8; }
  
  .x-follow-btn { 
    background: #eff3f4; color: #0f1419; border: none; border-radius: 999px; 
    padding: 8px 20px; font-size: 14.5px; font-weight: 600; cursor: pointer; 
    transition: all 0.2s; font-family: inherit;
  }
  .x-follow-btn.followed { background: transparent; color: #e7e9ea; border: 1px solid #536471; }
  .x-follow-btn.followed:hover { background: rgba(244, 33, 46, 0.1); color: #f4212e; border-color: rgba(244, 33, 46, 0.4); }

  .x-info { padding: 14px 18px 0; }
  .x-name { font-size: 24px; font-weight: 600; letter-spacing: 1px; }
  .x-handle { font-size: 15px; color: #71767b; margin-top: 4px; }
  .x-bio { font-size: 16px; line-height: 1.8; margin-top: 14px; letter-spacing: 0.5px; }
  
  /* 选项卡 */
  .x-tabs { display: flex; margin-top: 20px; border-bottom: 1px solid #2f3336; }
  .x-tab { flex: 1; text-align: center; padding: 15px 0; font-size: 15px; color: #71767b; cursor: pointer; transition: color 0.2s; position: relative; letter-spacing: 1px; }
  .x-tab:hover { background: rgba(255,255,255,0.03); }
  .x-tab.active { color: #e7e9ea; font-weight: 600; }
  .x-tab.active::after { content: ""; position: absolute; bottom: -1px; left: 50%; transform: translateX(-50%); width: 40%; height: 3px; background: #1d9bf0; border-radius: 999px; }

  /* 内容区 */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* 推文通用 */
  .tweet { padding: 16px 18px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px; }
  .tweet-avatar { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
  .tweet-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .tweet-body { flex: 1; min-width: 0; }
  .tweet-head { display: flex; gap: 6px; font-size: 15.5px; align-items: center; }
  .tweet-head .n { font-weight: 600; color: #e7e9ea; }
  .tweet-head .h { color: #71767b; font-size: 15px; }
  .tweet-photo { margin-top: 10px; border-radius: 16px; overflow: hidden; border: 1px solid #2f3336; }
  .tweet-photo img { width: 100%; display: block; }
  .tweet-text { font-size: 16px; margin-top: 10px; line-height: 1.8; color: #e7e9ea; white-space: pre-wrap; letter-spacing: 0.5px; }

  /* 互动图标区 */
  .tweet-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; max-width: 440px; color: #71767b; font-size: 13.5px; }
  .action-item { display: flex; align-items: center; gap: 5px; cursor: pointer; transition: color 0.2s; }
  .action-item svg { width: 18px; height: 18px; fill: currentColor; transition: fill 0.2s; }
  .action-item.comment:hover { color: #1d9bf0; }
  .action-item.retweet:hover { color: #00ba7c; }
  .action-item.like:hover { color: #f91880; }
  .action-item.bookmark:hover { color: #1d9bf0; }
  .action-item.share:hover { color: #1d9bf0; }

  /* 空状态 */
  .empty-state { padding: 60px 20px; text-align: center; color: #71767b; font-size: 16px; letter-spacing: 1px; }

  /* 评论详情页 */
  .comment-page-tweet { padding: 16px 18px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px; }
  .comment-page-tweet .tweet-text { font-size: 18px; margin-top: 16px; }
  .comment-page-tweet .tweet-actions { border-top: 1px solid #2f3336; padding-top: 14px; margin-top: 16px; }
  
  .reply-box { padding: 16px 18px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px; }
  .reply-box input { flex: 1; background: transparent; border: none; outline: none; color: #e7e9ea; font-size: 16px; font-family: inherit; }
  .reply-box input::placeholder { color: #71767b; }
  .reply-btn { background: #1d9bf0; color: #fff; border: none; border-radius: 999px; padding: 6px 16px; font-weight: 600; font-size: 14px; cursor: pointer; opacity: 0.5; font-family: inherit; }

  .comment-list { display: flex; flex-direction: column; }
  .comment-item { padding: 16px 18px; border-bottom: 1px solid #2f3336; display: flex; gap: 12px; }
  .comment-item .c-body { flex: 1; }
  .comment-item .c-head { display: flex; gap: 6px; font-size: 15px; align-items: center; margin-bottom: 6px; }
  .comment-item .c-name { font-weight: 600; color: #e7e9ea; }
  .comment-item .c-handle { color: #71767b; font-size: 14px; }
  .comment-item .c-text { font-size: 16px; color: #e7e9ea; line-height: 1.8; white-space: pre-wrap; letter-spacing: 0.5px; }
  .comment-item .c-actions { display: flex; gap: 30px; margin-top: 12px; color: #71767b; font-size: 13px; }
  .comment-item .c-actions span { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .comment-item .c-actions svg { width: 15px; height: 15px; fill: currentColor; }

  /* ══════════════════════════════════════════
     聊天界面特有样式
     ══════════════════════════════════════════ */
  .chat-header { display: flex; align-items: center; padding: 12px 16px; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #2f3336; flex-shrink: 0; z-index: 10; }
  .chat-header .back { font-size: 22px; cursor: pointer; width: 40px; color: #e7e9ea; }
  .chat-header .c-info { display: flex; flex-direction: column; align-items: center; flex: 1; }
  .chat-header .c-name { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
  .chat-header .c-status { font-size: 12px; color: #71767b; margin-top: 2px; }

  .chat-area { display: flex; flex-direction: column; padding: 20px 16px; gap: 16px; }
  
  .msg-bubble-row { display: flex; gap: 8px; max-width: 85%; }
  .msg-bubble-row.me { align-self: flex-end; flex-direction: row-reverse; }
  
  /* 独立的动画：只有气泡有浮现效果，头像直接出现 */
  .msg-bubble-row.new-msg .msg-bubble { opacity: 0; transform: translateY(10px); }
  .msg-bubble-row.show-msg .msg-bubble { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease, transform 0.4s ease; }

  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #1a1a1a; align-self: flex-end;}
  .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
  
  .msg-bubble {
    padding: 12px 16px; font-size: 16px; line-height: 1.6; border-radius: 18px;
    position: relative; word-break: break-word; letter-spacing: 0.5px;
  }
  
  /* 对方消息（灰色） */
  .msg-bubble-row.other .msg-bubble {
    background: #2f3336; color: #e7e9ea;
    border-bottom-left-radius: 4px;
  }
  
  /* 自己的消息（蓝色） */
  .msg-bubble-row.me .msg-bubble {
    background: #1d9bf0; color: #fff;
    border-bottom-right-radius: 4px;
  }

  /* ── 旁白文字 (视觉小说字幕效果) ── */
  .narration-text {
    display: flex; flex-direction: column; gap: 20px;
    padding: 16px 10px; margin: 10px 0;
  }
  .narration-line {
    text-align: center; font-size: 14.5px; color: #a0a0a0; line-height: 1.8;
    font-style: italic; opacity: 0; transform: translateY(15px);
    /* 统一过渡时间 */
    transition: opacity 1s ease, transform 1s ease;
    letter-spacing: 0.8px;
    /* 灰色的圆框背景 */
    background: rgba(255, 255, 255, 0.08);
    padding: 12px 20px;
    border-radius: 12px;
    margin: 0 auto;
    max-width: 95%;
  }
  .narration-line.show {
    opacity: 1; transform: translateY(0);
  }

  /* 正在输入动画 */
  .typing-dots { display: flex; gap: 4px; align-items: center; height: 20px; }
  .typing-dots span { width: 5px; height: 5px; background: #71767b; border-radius: 50%; animation: typing 1s infinite alternate; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0% { transform: translateY(0); opacity: 0.4; }
    100% { transform: translateY(-4px); opacity: 1; }
  }

  .chat-input-area {
    padding: 12px 16px; border-top: 1px solid #2f3336; background: #000;
    display: flex; gap: 12px; align-items: center; flex-shrink: 0;
  }
  .chat-input-area input {
    flex: 1; background: #16181c; border: none; outline: none; color: #e7e9ea;
    padding: 12px 16px; border-radius: 999px; font-size: 16px; font-family: inherit;
  }
  .chat-input-area input::placeholder { color: #71767b; }
  .send-btn { background: #1d9bf0; color: #fff; border: none; border-radius: 999px; padding: 10px 20px; font-weight: 600; font-size: 15px; cursor: pointer; opacity: 1; transition: opacity 0.2s; font-family: inherit; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ══════════════════════════════════════════
     悬浮音乐播放按钮 (支持拖拽)
     ══════════════════════════════════════════ */
  .music-btn {
    position: absolute; bottom: 24px; right: 24px; z-index: 99;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex; align-items: center; justify-content: center;
    cursor: grab; 
    transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, color 0.3s;
    color: #e7e9ea;
    touch-action: none; 
  }
  .music-btn:active { cursor: grabbing; }
  .music-btn:hover { background: rgba(255, 255, 255, 0.2); }
  .music-btn svg { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
  
  .music-btn.playing {
    background: rgba(29, 155, 240, 0.2);
    border-color: rgba(29, 155, 240, 0.5);
    color: #1d9bf0;
    box-shadow: 0 0 15px rgba(29, 155, 240, 0.5);
  }
</style>
</head>
<body>

<audio id="bgMusic" loop>
  <source src="音乐.mp3" type="audio/mpeg">
  您的浏览器不支持音频播放。
</audio>

<div class="phone" id="phoneContainer">
  <!-- 1. 浏览器界面 -->
  <div class="browser-view" id="browserView">
    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索或输入网址" autocomplete="off">
      </div>
      <div class="history-panel" id="historyPanel">
        <div class="history-header"><span>Recent</span></div>
        <div class="history-item" id="historyX">
          <div style="font-weight:bold; color:#999;">X</div>
          <div class="h-text">X</div>
        </div>
      </div>
    </div>
    <div class="caption">I will always be here.</div>
  </div>

  <!-- 2. X 启动动画 -->
  <div class="x-splash" id="xSplash">
    <svg viewBox="0 0 24 24">
      <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
    </svg>
  </div>

  <!-- 3. X 主体内容 -->
  <div class="x-view" id="xView">
    
    <!-- 悬浮音乐按钮 -->
    <div class="music-btn" id="musicBtn">
      <svg id="iconPlay" viewBox="0 0 24 24" style="display:none;"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <svg id="iconPause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </div>

    <!-- 主页 -->
    <div class="page-main">
      <div class="x-topbar">
        <div class="back" id="backBtn">←</div>
        <div class="name">文翡</div>
        <div style="width:40px;"></div>
      </div>

      <div class="x-scroll">
        <div class="x-banner"><img src="banner.jpg" alt="背景"></div>

        <div class="x-avatar-row">
          <div class="x-avatar"><img src="avatar.jpg" alt="头像"></div>
          <div class="x-actions-row">
            <button class="x-action-btn outline" id="msgBtn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"/></svg>
              发消息
            </button>
            <button class="x-follow-btn" id="followBtn">关注</button>
          </div>
        </div>

        <div class="x-info">
          <div class="x-name">文翡</div>
          <div class="x-handle">@DidosLament</div>
          <div class="x-bio">
            23岁 水瓶座<br>
            我实在概括不出来，凑点字数看个热闹吧，没什么参考价值
          </div>
        </div>

        <div class="x-tabs" id="tabsContainer">
          <div class="x-tab active" data-target="posts">帖子</div>
          <div class="x-tab" data-target="replies">回复</div>
          <div class="x-tab" data-target="media">媒体</div>
          <div class="x-tab" data-target="likes">喜欢</div>
        </div>

        <!-- 帖子内容区 -->
        <div class="tab-content active" id="tab-posts">
          <!-- 第一条推文 (带图短句) -->
          <div class="tweet">
            <div class="tweet-avatar"><img src="avatar.jpg"></div>
            <div class="tweet-body">
              <div class="tweet-head"><span class="n">文翡</span><span class="h">@DidosLament · 2月14日</span></div>
              <div class="tweet-photo"><img src="tweet.jpg" alt="推文图"></div>
              <div class="tweet-text">。</div>
              <div class="tweet-actions">
                <div class="action-item comment" onclick="openComment(1)">
                  <svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"/></svg>

  const xSplash = document.getElementById('xSplash');
  
  const bgMusic = document.getElementById('bgMusic');

  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');

  searchInput.addEventListener('focus', () => historyPanel.classList.add('open'));
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) historyPanel.classList.remove('open');
  });

  function updateMusicUI(isPlaying) {
    if (isPlaying) {
      iconPause.style.display = 'block';
      iconPlay.style.display = 'none';
      musicBtn.classList.add('playing');
    } else {
      iconPause.style.display = 'none';
      iconPlay.style.display = 'block';
      musicBtn.classList.remove('playing');
    }
  }

  historyX.addEventListener('click', () => {
    historyPanel.classList.remove('open');
    browserView.classList.add('hide');
    
    bgMusic.currentTime = 0;
    bgMusic.play().then(() => {
      updateMusicUI(true);
    }).catch(err => {
      console.log('音乐播放失败:', err);
      updateMusicUI(false);
    });

    xSplash.classList.add('show');

    setTimeout(() => {
      xSplash.classList.remove('show');
      xView.classList.add('show');
    }, 1200);
  });

  backBtn.addEventListener('click', () => {
    xView.classList.remove('show');
    browserView.classList.remove('hide');
    searchInput.value = '';
    
    bgMusic.pause();
    bgMusic.currentTime = 0;

    switchTab('posts');
    resetChat();

  // ══════════════════════════════════════════
  // 2. 音乐拖拽逻辑
  // ══════════════════════════════════════════
  let isDragging = false;
  let hasMoved = false;
  let startX, startY, initialLeft, initialTop;

  function initBtnPos() {
    const rect = musicBtn.getBoundingClientRect();
    const parentRect = document.getElementById('phoneContainer').getBoundingClientRect();
    musicBtn.style.left = (rect.left - parentRect.left) + 'px';
    musicBtn.style.top = (rect.top - parentRect.top) + 'px';
    musicBtn.style.right = 'auto';
    musicBtn.style.bottom = 'auto';
  }

  musicBtn.addEventListener('pointerdown', (e) => {
    isDragging = true;
    hasMoved = false;
    musicBtn.setPointerCapture(e.pointerId);
    if (!musicBtn.style.left) initBtnPos();
    startX = e.clientX;
    startY = e.clientY;
    initialLeft = parseFloat(musicBtn.style.left);
    initialTop = parseFloat(musicBtn.style.top);
  });

  musicBtn.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) hasMoved = true;

    if (hasMoved) {
      const parent = document.getElementById('phoneContainer');
      const maxLeft = parent.clientWidth - musicBtn.offsetWidth;
      const maxTop = parent.clientHeight - musicBtn.offsetHeight;
      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;
      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));
      musicBtn.style.left = newLeft + 'px';
      musicBtn.style.top = newTop + 'px';
    }
  });

  musicBtn.addEventListener('pointerup', (e) => {
    isDragging = false;
    musicBtn.releasePointerCapture(e.pointerId);
    if (!hasMoved) {
      if (bgMusic.paused) {
        bgMusic.play().then(() => updateMusicUI(true)).catch(e => console.log(e));
      } else {
        bgMusic.pause();
        updateMusicUI(false);
      }
    }
  });

  window.addEventListener('resize', () => {
    const parent = document.getElementById('phoneContainer');
    if (musicBtn.style.left) {
      let left = parseFloat(musicBtn.style.left);
      let top = parseFloat(musicBtn.style.top);
      const maxLeft = parent.clientWidth - musicBtn.offsetWidth;
      const maxTop = parent.clientHeight - musicBtn.offsetHeight;
      musicBtn.style.left = Math.max(0, Math.min(left, maxLeft)) + 'px';
      musicBtn.style.top = Math.max(0, Math.min(top, maxTop)) + 'px';
    }
  });

            <div class="action-item"><svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"/></svg></div>
            <div class="action-item"><svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"/></svg></div>
            <div class="action-item"><svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg></div>
            <div class="action-item"><svg viewBox="0 0 24 24"><path d="M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5zM6.5 4c-.276 0-.5.22-.5.5v14.56l6-4.29 6 4.29V4.5c0-.28-.224-.5-.5-.5h-11z"/></svg></div>
            <div class="action-item"><svg viewBox="0 0 24 24"><path d="M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.11 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"/></svg></div>
          </div>
        </div>
      </div>
    `;

    commentList.innerHTML = '';
    if (commentsData[tweetId].length === 0) {
      commentList.innerHTML = `<div style="padding: 40px 20px; text-align: center; color: #71767b; font-size: 16px;">还没有评论</div>`;
    } else {
      commentsData[tweetId].forEach(c => {
        commentList.innerHTML += `
          <div class="comment-item">
            <div class="tweet-avatar"><img src="${c.avatar}"></div>
            <div class="c-body">
              <div class="c-head"><span class="c-name">${c.name}</span><span class="c-handle">${c.handle}</span></div>
              <div class="c-text">${c.text}</div>
              <div class="c-actions">
                <span><svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"/></svg></span>
                <span><svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"/></svg></span>
              </div>
            </div>
          </div>
        `;
      });
    }

    xView.classList.add('in-comment');
    document.querySelector('.page-comment .x-scroll').scrollTop = 0;
  };

  commentBackBtn.addEventListener('click', () => {
    xView.classList.remove('in-comment');
  });

  // ══════════════════════════════════════════
  // 5. 对话剧本逻辑
  // ══════════════════════════════════════════
  const chatBackBtn = document.getElementById('chatBackBtn');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatArea = document.getElementById('chatArea');
  const chatStatus = document.getElementById('chatStatus');
  const msgBtn = document.getElementById('msgBtn');

  let chatStage = 0; 
  let typingTimeout;

  function resetChat() {
    chatStage = 0;
    chatArea.innerHTML = '';
    chatInput.value = '';
    chatInput.disabled = true;
    sendBtn.disabled = true;
    chatInput.placeholder = "等待对方消息...";
    chatStatus.textContent = '在线';
    chatStatus.style.color = '#71767b';
    clearTimeout(typingTimeout);
  }

  msgBtn.addEventListener('click', () => {
    xView.classList.add('in-chat');
    if (chatStage === 0) {
      startChatScript();
    }
    chatArea.scrollTop = chatArea.scrollHeight;
  });

  chatBackBtn.addEventListener('click', () => {
    xView.classList.remove('in-chat');
  });

  function addOtherMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-bubble-row other new-msg';
    row.innerHTML = `
      <div class="msg-avatar"><img src="avatar.jpg"></div>
      <div class="msg-bubble">${text}</div>
    `;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    
    setTimeout(() => {
      row.classList.remove('new-msg');
      row.classList.add('show-msg');
    }, 50);
  }

  function addMeMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-bubble-row me new-msg';
    row.innerHTML = `<div class="msg-bubble">${text}</div>`;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    
    setTimeout(() => {
      row.classList.remove('new-msg');
      row.classList.add('show-msg');
    }, 50);
  }

  // 修改：正在输入的持续时间现在作为参数传入，以便精确控制
  function showTyping(duration, callback) {
    const row = document.createElement('div');
    row.className = 'msg-bubble-row other';
    row.id = 'typingIndicator';
    row.innerHTML = `
      <div class="msg-bubble" style="border-bottom-left-radius: 18px; margin-left: 36px;"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    `;
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    
    setTimeout(() => {
      row.remove();
      callback();
    }, duration);
  }

  function startChatScript() {
    chatStage = 1;
    typingTimeout = setTimeout(() => {
      showTyping(800, () => {
        addOtherMsg('你要先讲讲关于我的事情，我才愿意和你交换。');
        
        chatInput.disabled = false;
        sendBtn.disabled = false;
        chatInput.value = '点击发送，我会一句一句说给你听。';
        chatInput.placeholder = "输入消息...";
        chatInput.focus();
      });
    }, 800);
  }

  function sendMessage() {
    if (chatStage !== 1) return;
    
    chatInput.value = '';
    chatInput.disabled = true;
    sendBtn.disabled = true;
    chatInput.placeholder = "等待对方消息...";
    
    // 用户发送期间，顶部状态不显示“正在输入”
    chatStatus.textContent = '在线';
    chatStatus.style.color = '#71767b';

    chatStage = 2;

    const lines = [
      '你的名字叫文翡，你有一双漂亮的眼珠。',
      '有人供你吃喝，给你穿漂亮衣裳，就是大家想象中好女学生的样子。',
      '十几二十年前，你在这里哭了第一声，',
      '你张开细小的手掌学走路，你叫“爸爸，妈妈”，',
      '你站在房间里望着十二单衣的娃娃……'
    ];
    
    let delay = 0;
    const INTERVAL = 1500; // 用户每句间隔1.5s

    lines.forEach((line) => {
      setTimeout(() => {
        addMeMsg(line);
      }, delay + INTERVAL); 
      delay += INTERVAL; 
    });

    // 1. 用户发完最后一句后，等待 1.5 秒才显示正在输入
    setTimeout(() => {
      // 此时才把状态切换为“正在输入...”
      chatStatus.textContent = '正在输入...';
      chatStatus.style.color = '#1d9bf0';

      // 2. 正在输入持续 1.5 秒
      showTyping(1500, () => {
        chatStatus.textContent = '在线';
        chatStatus.style.color = '#71767b';
        
        // 3. 文翡回复（此时约过了 1.5s）
        addOtherMsg('还有多久说到我嫁给你的部分？');

        // 4. 文翡说完后，再等 2 秒出旁白
        setTimeout(() => {
          const narrationDiv = document.createElement('div');
          narrationDiv.className = 'narration-text';
          narrationDiv.innerHTML = `
            <div class="narration-line">你呢，一个天真轻信的人，在这个世界里游荡，无可救药地爱，侍奉，等待。</div>
            <div class="narration-line">然而，顽劣的恋人不会以可爱的形态回来。</div>
            <div class="narration-line">那么，帆船驾驶着这黑巧布朗尼一样寂寞的故事，它关于上天与书籍，</div>
            <div class="narration-line">文字控制着天气，讨论嘴唇与长发冰冻了几个世纪；</div>
            <div class="narration-line">再然后磅礴的雨在这时，水泼落地……</div>
          `;
          chatArea.appendChild(narrationDiv);
          chatArea.scrollTop = chatArea.scrollHeight;

          const nLines = narrationDiv.querySelectorAll('.narration-line');
          
          // 5. 旁白每句间隔 1.5s 出现
          const NARRATION_INTERVAL = 1500;

          setTimeout(() => {
            nLines[0].classList.add('show');
            chatArea.scrollTop = chatArea.scrollHeight;
          }, 100);

          setTimeout(() => {
            nLines[1].classList.add('show');
            chatArea.scrollTop = chatArea.scrollHeight;
          }, 100 + NARRATION_INTERVAL);

          setTimeout(() => {
            nLines[2].classList.add('show');
            chatArea.scrollTop = chatArea.scrollHeight;
          }, 100 + NARRATION_INTERVAL * 2);

          setTimeout(() => {
            nLines[3].classList.add('show');
            chatArea.scrollTop = chatArea.scrollHeight;
          }, 100 + NARRATION_INTERVAL * 3);

          setTimeout(() => {
            nLines[4].classList.add('show');
            chatArea.scrollTop = chatArea.scrollHeight;
          }, 100 + NARRATION_INTERVAL * 4);
          
          chatStage = 3;
        }, 2000); // 文翡说完，等 2 秒

      });
    }, delay + 1500); // 你最后一句发完，等 1.5s
  }

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

</script>
